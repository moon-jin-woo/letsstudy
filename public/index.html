<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>Let's Study · 공통국어2</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Let's Study <span>공통국어2</span></div>
    <div id="saveState" class="save-state">자동 저장</div>
  </header>
  <main class="shell">
    <section class="hero">
      <p class="eyebrow">고1 중간고사 대비</p>
      <h1>풀고, 바로 채점하고,<br>틀린 이유까지 잡기.</h1>
      <p>객관식 15문항은 즉시 채점하고, 서술형 15문항은 AI가 채점 기준에 따라 부분점수와 피드백을 제공합니다.</p>
    </section>
    <section id="dashboard" class="dashboard"></section>
    <nav class="tabs" aria-label="학습 모드">
      <button data-view="mcq" class="tab active">객관식</button>
      <button data-view="essay" class="tab">서술형 AI 채점</button>
      <button data-view="results" class="tab">결과 분석</button>
    </nav>
    <section id="mcqView" class="view"></section>
    <section id="essayView" class="view hidden"></section>
    <section id="resultsView" class="view hidden"></section>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
